services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: weather_station
      MYSQL_ROOT_HOST: '%'
    command: 
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network
  data-generator:
    build: .
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: weather_station
      DB_PORT: 3306
    networks:
      - app-network
  postgres:
    image: postgres:12
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: redash
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    networks:
      - app-network
  redis:
    image: redis:6-alpine
    restart: always
    command: redis-server --appendonly yes
    networks:
      - app-network
  redash-create-db:
    image: redash/redash:latest
    environment:
      REDASH_DATABASE_URL: postgresql://postgres:root@postgres/redash
      REDASH_REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    command: >
      sh -c "/app/bin/wait-for-it postgres:5432 --timeout=30 --strict -- /app/bin/run python /app/manage.py create_db"
    networks:
      - app-network
    restart: "no"
  redash-server:
    image: redash/redash:latest
    ports:
      - "5000:5000"
    command: server
    environment:
      REDASH_DATABASE_URL: postgresql://postgres:root@postgres/redash
      REDASH_REDIS_URL: redis://redis:6379/0
      REDASH_LOG_LEVEL: INFO
      REDASH_COOKIE_SECRET: weather_station_secret
      REDASH_SECRET_KEY: weather_station_secret_key
      REDASH_HOST: http://localhost:5000
    depends_on:
      - postgres
      - redis
    restart: always
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  scheduler:
    image: redash/redash:latest
    depends_on:
      - postgres
      - redis
    environment:
      REDASH_LOG_LEVEL: INFO
      REDASH_REDIS_URL: redis://redis:6379/0
      REDASH_DATABASE_URL: postgresql://postgres:root@postgres/redash
    command: scheduler
    restart: always
    networks:
      - app-network
  scheduled_worker:
    image: redash/redash:latest
    depends_on:
      - postgres
      - redis
    environment:
      REDASH_LOG_LEVEL: INFO
      REDASH_REDIS_URL: redis://redis:6379/0
      REDASH_DATABASE_URL: postgresql://postgres:root@postgres/redash
    restart: always
    command: worker
    networks:
      - app-network
  nginx:
    image: redash/nginx:latest
    ports:
      - "80:80"
    depends_on:
      redash-server:
        condition: service_healthy
    restart: always
    networks:
      - app-network
volumes:
  db_data:
  postgres_data:
networks:
  app-network:
    driver: bridge
