services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: weather_station
    ports:
      - "3306:3306"
    command: --init-file init.sql
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:./init.sql
    networks:
      - app-network
  data-generator:
    build: .
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: weather_station
      DB_PORT: 3306
    networks:
      - app-network
volumes:
  db_data:
networks:
  app-network:
    driver: bridge
