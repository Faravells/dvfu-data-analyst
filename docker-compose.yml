services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: weather_station
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network
  data-generator:
    build: .
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: weather_station
      DB_PORT: 3306
    networks:
      - app-network
  redash:
    image: redash/redash:latest
    ports:
      - "5000:5000"
    environment:
      REDASH_DATABASE_URL: postgresql://postgres@postgres/redash
      REDASH_REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    networks:
      - app-network
  postgres:
    image: postgres:12
    environment:
      POSTGRES_PASSWORD: root
      POSTGRES_DB: redash
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
  redis:
    image: redis:6-alpine
    networks:
      - app-network
volumes:
  db_data:
  postgres_data:
networks:
  app-network:
    driver: bridge
